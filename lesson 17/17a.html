<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 17 Exercise - More CSS Features</title>
  <style>
    /* Basic Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Roboto, Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
    }

    /* Grid Layout for Videos */
    .video-grid {
      display: grid;
      /* This creates a responsive grid that fits as many 300px columns as possible */
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Individual Video Card */
    .video-card {
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Thumbnail Container */
    .thumbnail-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; /* Keeps thumbnails perfectly rectangular */
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Video Duration Timestamp */
    .video-time {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 4px;
      border-radius: 2px;
    }

    /* Video Info Section */
    .video-info-grid {
      display: grid;
      grid-template-columns: 36px 1fr; /* 36px for avatar, rest for text */
      column-gap: 12px;
      padding: 12px;
    }

    .channel-avatar img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Video Title */
    .video-title {
      font-size: 14px; /* Default size */
      font-weight: 500;
      line-height: 20px; /* Default line-height */
      color: #0f0f0f;
      margin-bottom: 4px;
      /* Clamp text to 2 lines just like real YouTube */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Video Author and Stats */
    .video-author, .video-stats {
      font-size: 12px; /* Default size */
      color: #606060;
      line-height: 18px;
    }

    /* =========================================
       LESSON 17 EXERCISE 17a CODE
       ========================================= */
    @media (min-width: 1000px) {
      /* For video titles, set font-size = 16px, line-height = 24px */
      .video-title {
        font-size: 16px;
        line-height: 24px;
      }

      /* For other text, set font-size = 14px */
      .video-author, 
      .video-stats {
        font-size: 14px;
      }
    }
    /* ========================================= */

  </style>
</head>
<body>

  <div class="video-grid">
    
    <!-- Video 1 -->
    <div class="video-card">
      <div class="thumbnail-container">
        <!-- Placeholder image representing the thumbnail -->
        <img src="https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&w=600&q=80" alt="Talking Tech Thumbnail">
        <div class="video-time">14:20</div>
      </div>
      <div class="video-info-grid">
        <div class="channel-avatar">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Marques Brownlee">
        </div>
        <div class="video-text">
          <p class="video-title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
          <p class="video-author">Marques Brownlee</p>
          <p class="video-stats">3.4M views &middot; 6 months ago</p>
        </div>
      </div>
    </div>

    <!-- Video 2 -->
    <div class="video-card">
      <div class="thumbnail-container">
        <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=600&q=80" alt="Try Not To Laugh Thumbnail">
        <div class="video-time">8:22</div>
      </div>
      <div class="video-info-grid">
        <div class="channel-avatar">
          <img src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?auto=format&fit=crop&w=100&q=80" alt="Markiplier">
        </div>
        <div class="video-text">
          <p class="video-title">Try Not To Laugh Challenge #9</p>
          <p class="video-author">Markiplier</p>
          <p class="video-stats">19M views &middot; 4 years ago</p>
        </div>
      </div>
    </div>

    <!-- Video 3 -->
    <div class="video-card">
      <div class="thumbnail-container">
        <img src="https://images.unsplash.com/photo-1517400508447-f8dd518b86db?auto=format&fit=crop&w=600&q=80" alt="Crazy Tik Toks Thumbnail">

        <div class="channel-avatar">

        <div class="video-text">

  </div>

</body>
